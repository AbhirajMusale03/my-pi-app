<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FAF7F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Pi, Your Personal Ai</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FAF7F2;
      --bg-card: #F2ECE1;
      --green-deep: #163329;
      --green-soft: #265242;
      --green-light: #E3EDE8;
      --text-main: #1C2B25;
      --text-muted: #64756E;
      --border-soft: #E5DEC9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background-color: rgba(250, 247, 242, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pi-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #163329, #2E6652);
      color: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      font-size: 22px;
      font-weight: 600;
      position: relative;
      box-shadow: 0 4px 12px rgba(22, 51, 41, 0.15);
    }

    .online-dot {
      width: 11px;
      height: 11px;
      background-color: #22C55E;
      border: 2px solid var(--bg-cream);
      border-radius: 50%;
      position: absolute;
      bottom: 1px;
      right: 1px;
    }

    .brand-info h1 {
      font-family: 'Lora', serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--green-deep);
    }

    .brand-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .mode-btn {
      background-color: var(--bg-card);
      color: var(--green-deep);
      border: 1px solid var(--border-soft);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mode-btn.thinking-active {
      background-color: var(--green-deep);
      color: #FAF7F2;
      border-color: var(--green-deep);
      box-shadow: 0 2px 10px rgba(22, 51, 41, 0.2);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 86%;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-wrapper.user {
      align-self: flex-end;
    }

    .message-wrapper.pi {
      align-self: flex-start;
    }

    .bubble {
      padding: 13px 17px;
      border-radius: 22px;
      line-height: 1.55;
      font-size: 15.5px;
      word-wrap: break-word;
    }

    .message-wrapper.user .bubble {
      background-color: var(--bg-card);
      color: var(--text-main);
      border-bottom-right-radius: 6px;
      border: 1px solid var(--border-soft);
    }

    .message-wrapper.pi .bubble {
      background-color: transparent;
      color: var(--green-deep);
      font-family: 'Lora', serif;
      font-size: 16.5px;
      padding: 6px 4px;
    }

    .attachment-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--green-light);
      color: var(--green-deep);
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 12px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      color: var(--text-muted);
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 14px;
      padding: 4px 16px 8px;
    }

    #file-preview-bar {
      display: none;
      padding: 8px 16px;
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-soft);
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--green-deep);
    }

    #remove-file-btn {
      background: none;
      border: none;
      color: #B91C1C;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    .input-area {
      padding: 12px 14px 18px;
      background-color: var(--bg-cream);
      border-top: 1px solid var(--border-soft);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .attach-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--green-deep);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .input-box {
      flex: 1;
      background-color: #FFFFFF;
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text-main);
      max-height: 110px;
      background: transparent;
      line-height: 1.4;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: var(--green-deep);
      color: #FAF7F2;
      border: none;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .send-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="pi-avatar">
        Pi
        <span class="online-dot"></span>
      </div>
      <div class="brand-info">
        <h1>Pi, Your Personal Ai</h1>
        <p id="status-subtitle">Always here with you 🤍</p>
      </div>
    </div>
    <button id="mode-toggle" class="mode-btn" onclick="toggleMode()">🌿 Normal</button>
  </header>

  <div id="chat-container"></div>
  <div id="typing" class="typing-indicator">Pi is listening with care... 🤍✨</div>

  <div id="file-preview-bar">
    <span id="file-name-label">📎 File attached</span>
    <button id="remove-file-btn" onclick="clearAttachment()">✕ Remove</button>
  </div>

  <div class="input-area">
    <input type="file" id="file-input" style="display:none" onchange="handleFileSelect(event)" />
    <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file or photo">+</button>
    <div class="input-box">
      <textarea id="user-input" rows="1" placeholder="Talk with Pi..." oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" onclick="sendMessage()">↑</button>
  </div>

    let chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    const chatContainer = document.getElementById("chat-container");

    function renderInitialMessages() {
      chatContainer.innerHTML = "";
      chatHistory.forEach(msg => {
        appendBubble(msg.role === "user" ? "user" : "pi", msg.display || msg.content, msg.fileName || "");
      });
      scrollToBottom();
    }

      if (fileName) {
        const badge = document.createElement("div");
        badge.className = "attachment-badge";
        badge.textContent = `📎 ${fileName}`;
