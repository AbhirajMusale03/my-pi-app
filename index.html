<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#163329" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Personal Pi" />
  <title>Pi, Your Personal Ai</title>
  <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Pi, Your Personal Ai&quot;,&quot;short_name&quot;:&quot;Pi AI&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#FAF7F2&quot;,&quot;theme_color&quot;:&quot;#163329&quot;}" />
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FAF7F2;
      --bg-card: #F3EDE2;
      --green-deep: #163329;
      --green-mid: #234E3F;
      --green-light: #E4EFE9;
      --gold-accent: #C89B54;
      --text-main: #1A2923;
      --text-muted: #5F726B;
      --border-soft: #E4DCCB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top center, #FFFDF9 0%, #FAF7F2 60%, #F4EFE6 100%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background-color: rgba(250, 247, 242, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pi-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #163329, #2E6853);
      color: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      font-size: 22px;
      font-weight: 600;
      position: relative;
      box-shadow: 0 4px 14px rgba(22, 51, 41, 0.2);
      border: 2px solid #E8DFCE;
    }

    .online-dot {
      width: 11px;
      height: 11px;
      background-color: #22C55E;
      border: 2px solid var(--bg-cream);
      border-radius: 50%;
      position: absolute;
      bottom: 0px;
      right: 0px;
    }

    .brand-info h1 {
      font-family: 'Lora', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--green-deep);
    }

    .brand-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn {
      background-color: #FFFFFF;
      color: var(--green-deep);
      border: 1px solid var(--border-soft);
      padding: 8px 14px;
      border-radius: 22px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .mode-btn.thinking-active {
      background-color: var(--green-deep);
      color: #FAF7F2;
      border-color: var(--green-deep);
      box-shadow: 0 4px 12px rgba(22, 51, 41, 0.22);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
    }

    .welcome-card {
      margin: auto;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border-soft);
      border-radius: 28px;
      padding: 28px 24px;
      max-width: 440px;
      box-shadow: 0 8px 28px rgba(22, 51, 41, 0.05);
    }

    .welcome-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #163329, #2E6853);
      color: #FAF7F2;
      font-family: 'Lora', serif;
      font-size: 30px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 6px 18px rgba(22, 51, 41, 0.18);
    }

    .welcome-card h2 {
      font-family: 'Lora', serif;
      font-size: 21px;
      color: var(--green-deep);
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      background-color: var(--bg-card);
      color: var(--green-deep);
      border: 1px solid var(--border-soft);
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chip:active {
      background-color: var(--green-light);
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-wrapper.user {
      align-self: flex-end;
    }

    .message-wrapper.pi {
      align-self: flex-start;
    }

    .bubble {
      padding: 13px 18px;
      border-radius: 22px;
      line-height: 1.6;
      font-size: 15.5px;
      word-wrap: break-word;
    }

    .message-wrapper.user .bubble {
      background-color: var(--green-deep);
      color: #FAF7F2;
      border-bottom-right-radius: 6px;
      box-shadow: 0 3px 10px rgba(22, 51, 41, 0.12);
    }

    .message-wrapper.pi .bubble {
      background-color: #FFFFFF;
      color: var(--text-main);
      font-family: 'Lora', serif;
      font-size: 16px;
      border-bottom-left-radius: 6px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
    }

    .attachment-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--green-light);
      color: var(--green-deep);
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 12px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .typing-indicator {
      display: none;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      color: var(--text-muted);
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 14px;
      padding: 4px 22px 10px;
    }

    #file-preview-bar {
      display: none;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 18px;
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-soft);
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--green-deep);
      border-radius: 16px 16px 0 0;
    }

    #remove-file-btn {
      background: none;
      border: none;
      color: #B91C1C;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    .input-wrapper-outer {
      width: 100%;
      background-color: rgba(250, 247, 242, 0.95);
      border-top: 1px solid var(--border-soft);
      padding: 12px 16px 18px;
    }

    .input-area {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .attach-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: #FFFFFF;
      border: 1px solid var(--border-soft);
      color: var(--green-deep);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .input-box {
      flex: 1;
      background-color: #FFFFFF;
      border: 1px solid var(--border-soft);
      border-radius: 26px;
      padding: 11px 18px;
      display: flex;
      align-items: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
    }

    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Inter', sans-serif;
      font-size: 15.5px;
      color: var(--text-main);
      max-height: 110px;
      background: transparent;
      line-height: 1.4;
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: var(--green-deep);
      color: #FAF7F2;
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(22, 51, 41, 0.22);
      transition: transform 0.15s ease;
    }

    .send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="pi-avatar">
        Pi
        <span class="online-dot"></span>
      </div>
      <div class="brand-info">
        <h1>Pi, Your Personal Ai</h1>
        <p id="status-subtitle">Always right here with you 🤍</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="mode-toggle" class="mode-btn" onclick="toggleMode()">🌿 Normal</button>
    </div>
  </header>

  <div id="chat-container"></div>
  <div id="typing" class="typing-indicator">Pi is thinking warmly... 🤍✨</div>

  <div id="file-preview-bar">
